<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>ISDIN LAB · Iridiscente original restaurada</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dfedfc;display:grid;place-items:center}
main{position:relative;width:min(100vw,177.7778vh);aspect-ratio:16/9}canvas{display:block;width:100%;height:100%}
#error{position:absolute;inset:45% 10%;font:16px system-ui;color:#425c78;text-align:center}
</style>
</head>
<body>
<main><canvas aria-label="Esfera tridimensional ISDIN de cristal nacarado"></canvas><div id="error" hidden></div></main>
<script src="vendor/three.min.js"></script>
<script src="src/voice-response.js"></script>
<script src="src/orb.js"></script>
<script>
'use strict';
try {
 const orb=new OrbRenderer(document.querySelector('canvas'));
 const params={motion:1,speed:1,brightness:1,size:45};
 let previous=performance.now();
 window.ISDIN_VISUAL={orb,params,paused:false};
 function frame(now){
  const dt=Math.min((now-previous)/1000,.05);previous=now;
  if(!ISDIN_VISUAL.paused)orb.render(dt,{rms:0,playing:false},{},params);
  requestAnimationFrame(frame);
 }
 requestAnimationFrame(frame);
} catch(error){const el=document.querySelector('#error');el.hidden=false;el.textContent=error.message;}
</script>
</body>
</html>
